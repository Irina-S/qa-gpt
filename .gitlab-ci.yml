stages:
  - build
  - deploy


variables:
  DOCKER_IMAGE: aip/testgpt
  DOCKER_TAG: $CI_COMMIT_SHORT_SHA

build:
  stage: build
  tags:
    - aip
  script:
    - docker build -t $DOCKER_IMAGE:$DOCKER_TAG .

deploy:
  stage: deploy
  tags:
    - aip
  script:
    - docker run -d -p 212.113.117.4:8080:8080 --name testgpt $DOCKER_IMAGE:$DOCKER_TAG
